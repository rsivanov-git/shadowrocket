# Routing baseline: rsivanov-git/surge/Default.conf
[General]
# Shadowrocket uses dns-server for DoH, unlike Surge's encrypted-dns-server.
dns-server = https://dns.nextdns.io
# Keep fallback encrypted; Surge does not fall back to plain DNS for ordinary domains.
fallback-dns-server = https://dns.nextdns.io
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = false
use-local-host-item-for-proxy = true
udp-policy-not-supported-behaviour = REJECT
private-ip-answer = true
update-url = https://raw.githubusercontent.com/rsivanov-git/shadowrocket/main/Default.conf

[Host]
ntc.party = 130.255.77.28

[Rule]
DOMAIN,guzzoni.apple.com,PROXY
RULE-SET,SYSTEM,DIRECT
DOMAIN,_test.local,REJECT,pre-matching
# Explicit local rules instead of relying on Surge's built-in LAN rule set.
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
IP-CIDR6,ff00::/8,DIRECT,no-resolve
RULE-SET,https://surge.bojin.co/geosite/full/connectivity-check,DIRECT
RULE-SET,https://surge.bojin.co/geosite/full/category-ntp,DIRECT
RULE-SET,https://raw.githubusercontent.com/rsivanov-git/shadowrocket/main/Direct.list,DIRECT
# Russia
RULE-SET,https://surge.bojin.co/geosite/full/category-ru,DIRECT
GEOIP,RU,DIRECT,no-resolve
# Final
FINAL,PROXY
